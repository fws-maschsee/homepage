version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # @astrojs/check verlangt TypeScript ^5 || ^6; mit 7 scheitert `npm ci` an ERESOLVE.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
