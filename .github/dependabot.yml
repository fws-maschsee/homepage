# Warum `weekly`?
#
#   Ohne Majors bleibt pro Eintrag nur der Minor-/Patch-Sammel-PR -- der
#   kommt woechentlich. Security-Updates ignorieren `schedule` und kommen
#   weiterhin sofort.
#
# Warum `update-types` in der Gruppe `security`?
#
#   Damit der Security-Sammel-PR keine Majors enthaelt und automatisch
#   durchgehen kann. Ein Sicherheitsfix, den es nur als Major gibt, unterdrueckt
#   das `ignore` der Eintraege -- der muss von Hand nachgezogen werden.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check verlangt TypeScript ^5 || ^6; mit 7 scheitert `npm ci` an ERESOLVE.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Keine Major-Updates: Majors erst, wenn der Support endet (separat verfolgt).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
