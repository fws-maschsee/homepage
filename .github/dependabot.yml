# Warum `monthly`?
#
#   Jede rote Sammel-PR wurde bisher jede Woche durch eine neue ersetzt --
#   rund 470 Dependabot-PRs in 90 Tagen ueber alle Repos, nur die Haelfte
#   gemergt. Ein eigenes Intervall je Gruppe (etwa nur fuer `majors`) kennt
#   Dependabot nicht: `schedule` gilt pro Eintrag, und zwei Eintraege fuer
#   dasselbe Oekosystem und Verzeichnis sind verboten. Darum laeuft der ganze
#   Eintrag monatlich. Security-Updates ignorieren `schedule` und kommen
#   weiterhin sofort.
#
# Warum `update-types` in der Gruppe `security`?
#
#   Damit der Security-Sammel-PR keine Majors mehr enthaelt und automatisch
#   durchgehen kann. Ein Sicherheitsfix, den es nur als Major gibt, kommt als
#   eigener PR (Trailer `update-type: version-update:semver-major`) und wird
#   von automerge.yml als `major` gelabelt.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # @astrojs/check verlangt TypeScript ^5 || ^6; mit 7 scheitert `npm ci` an ERESOLVE.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Berlin
    labels:
      - dependencies
    # Hoch mit Absicht: Ist das Limit erschöpft, legt Dependabot auch die Sammel-PRs nicht mehr an.
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Eigene Gruppe nötig: Dependabot mischt Security- nie mit Version-Updates.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      majors:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
