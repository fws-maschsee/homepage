name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci`, nicht `npm install`: Die Lockfile entscheidet. Bricht dieser
      # Schritt mit "lock file out of sync" ab, wurde package.json geändert,
      # ohne danach `npm install` laufen zu lassen und die Lockfile
      # mitzucommitten.
      - run: npm ci

      - run: npm run build

      - run: npm run typecheck
