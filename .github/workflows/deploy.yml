name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Ein Job, weil es nur amd64 gibt: jeder weitere Job würde eigens auf volle Minuten aufgerundet. Für eine zweite
  # Architektur Bauen bis Push per Digest wieder als Matrix über native Runner abspalten und das Manifest in einem
  # Folgejob aus allen Digests erzeugen (server-config, Invariante 5).
  build:
    if: github.ref == 'refs/heads/main'
    # Nativer amd64-Runner, niemals QEMU (server-config, Invariante 5).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erst lokal laden und prüfen, damit nichts Kaputtes ins Register gelangt.
      - name: Build for local verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:verify
          platforms: linux/amd64

      - name: Verify image architecture
        run: |
          ARCH=$(docker image inspect "${IMAGE}:verify" --format '{{.Architecture}}')
          echo "architecture: $ARCH"
          [ "$ARCH" = "amd64" ] || {
            echo "::error::expected amd64, got $ARCH"; exit 1; }

      - name: Smoke test the image
        run: |
          # Startet wie im Cluster (deploy/app.yaml): nicht als root, Root-Dateisystem schreibgeschützt.
          docker run -d --name smoke \
            --user 1000:1000 --read-only --tmpfs /tmp \
            -p 3000:3000 "${IMAGE}:verify"
          CODE=000
          for _ in $(seq 1 30); do
            # Nicht `|| echo 000`: curl gibt selbst schon 000 aus, das ergäbe 000000.
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$CODE" != "000" ] && [ -n "$CODE" ] && break
            sleep 2
          done
          echo "server answered with HTTP $CODE"
          docker logs smoke
          docker rm -f smoke >/dev/null
          case "$CODE" in
            200) echo "smoke test passed (HTTP 200)" ;;
            ''|000) echo "::error::server never answered"; exit 1 ;;
            401|403) echo "::error::öffentliche Seite antwortet mit $CODE - steht hier ein Login davor?"; exit 1 ;;
            *) echo "::error::expected HTTP 200, got $CODE"; exit 1 ;;
          esac

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true

      - name: Compute tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Report the tag to pin
        run: |
          {
            echo "### Image gebaut"
            echo
            echo '```'
            echo "${IMAGE}:${{ steps.tag.outputs.tag }}"
            echo '```'
            echo
            echo "Diesen Tag in \`apps/homepage/kustomization.yaml\` von"
            echo "[fws-maschsee/server-config](https://github.com/fws-maschsee/server-config) eintragen"
            echo "und pushen - Argo CD rollt aus."
          } >> "$GITHUB_STEP_SUMMARY"

